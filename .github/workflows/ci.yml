name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Vérification
    runs-on: ubuntu-latest
    steps:
      - name: Signaler l'absence de tests et de lint
        run: echo "Dépôt Artworks Digital : pas de tests/lint configurés. Vérifiez manuellement avant déploiement."

      - name: Échec explicite — aucun outil de test trouvé
        run: exit 1
