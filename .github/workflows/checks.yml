# Ce que personne n'exécutait.
#
# Le dépôt n'avait aucun test et aucun workflow : rien ne vérifiait qu'une
# page rend encore, qu'une salle non publiée reste invisible, ou qu'un mot
# de passe repris de l'ancienne base ouvre toujours. Une sonde HTTP sur la
# production ne voit rien de tout cela — elle regarde l'accueil, pas les
# quarante écrans derrière la connexion.
#
# C'est aussi la mesure que lit K.A.E.L. : sans exécution sur `main`, il
# classe le dépôt comme angle mort.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Une nouvelle poussée annule la précédente : on garde le verdict du
  # dernier état du code, pas d'une révision déjà remplacée.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Aligné sur runtime.txt, que Scalingo lit ; setup-python ne
          # sait pas parser ce fichier-là, donc la version est répétée.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Démarrer l'application et vérifier l'accueil
        # Le test le plus bête et le plus utile : gunicorn démarre-t-il
        # vraiment avec la commande du Procfile ?
        env:
          DATABASE_URL: sqlite:///ci.db
          SECRET_KEY: ci
          CANONICAL_REDIRECT: "0"
          PORT: "8765"
        run: |
          set -euo pipefail
          gunicorn "artworks:create_app()" --bind 127.0.0.1:8765 --workers 1 --timeout 60 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then
              echo "accueil OK"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "gunicorn s'est arrêté avant de répondre" >&2
              exit 1
            fi
            sleep 2
          done
          echo "aucune réponse de l'accueil" >&2
          exit 1
