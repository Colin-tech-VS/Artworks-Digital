{#- Lettre complète dans la page, sans iframe authentifiée (cookies SameSite). -#}
<section class="mail-letter">
  <iframe
    class="mail-letter-frame"
    title="{{ title or 'Lettre' }}"
    sandbox="allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
    srcdoc="{{ letter_html | e }}"
  ></iframe>
</section>
