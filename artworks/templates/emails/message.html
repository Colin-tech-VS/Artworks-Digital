<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{ title }}</title>
<!--[if mso]>
<style>body, table, td, p, a { font-family: Georgia, 'Times New Roman', serif !important; }</style>
<![endif]-->
<style>
  @media only screen and (max-width: 620px) {
    .wrap { width: 100% !important; }
    .pad { padding-left: 24px !important; padding-right: 24px !important; }
    .h1 { font-size: 26px !important; line-height: 1.2 !important; }
    .btn a { display: block !important; text-align: center !important; }
    .cols td { display: block !important; width: 100% !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#f3efe6;-webkit-font-smoothing:antialiased;">
<div style="display:none;font-size:1px;color:#f3efe6;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{ preheader or title }}&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3efe6;">
  <tr>
    <td align="center" style="padding:32px 12px 48px;">

      <table role="presentation" class="wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">

        <!-- wordmark -->
        <tr>
          <td align="center" style="padding:0 0 22px;">
            <a href="{{ site_url }}" style="text-decoration:none;color:#161412;font-family:Georgia,'Times New Roman',serif;font-size:22px;letter-spacing:0.06em;">
              Artworks <em style="color:#5c4634;font-style:italic;">Digital</em>
            </a>
          </td>
        </tr>

        <!-- card -->
        <tr>
          <td style="background:#faf7f1;border:1px solid #d8d0c4;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              {% include "emails/_card.html" %}
            </table>
          </td>
        </tr>

        <!-- footer -->
        <tr>
          <td class="pad" style="padding:22px 20px 0;font-family:Helvetica,Arial,sans-serif;font-size:11px;line-height:1.8;color:#8a8177;text-align:center;">
            <a href="{{ site_url }}" style="color:#8a8177;text-decoration:none;">artworksdigital.fr</a>
            &nbsp;·&nbsp;
            <a href="{{ site_url }}/offres" style="color:#8a8177;text-decoration:none;">Offres</a>
            &nbsp;·&nbsp;
            <a href="{{ site_url }}/contact" style="color:#8a8177;text-decoration:none;">Contact</a>
            <br>
            La galerie appartient à l’artiste.
            {% if footer_note %}<br>{{ footer_note }}{% endif %}
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
